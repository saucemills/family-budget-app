[package]
name = "budget-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.4.0"
hex = "0.4.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
