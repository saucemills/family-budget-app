# Builds the Windows installer.
# - On a pull request: builds it to check nothing is broken (the installer is attached to the run).
# - On a version tag like v0.2.0: builds it and publishes a GitHub Release with the installer
#   and latest.json, which is what the app's "Update available" check reads.
name: Windows build

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build installer (and publish a release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Family Budget ${{ github.ref_name }}
          releaseBody: Download the -setup.exe file below to install. If you already have the app, it will offer this update when you open it.
          releaseDraft: false
          includeUpdaterJson: true

      - name: Keep the installer from this run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: family-budget-windows-installer
          path: target/release/bundle/nsis/*.exe
